name: Smoke Test

on:
  pull_request:
    branches: [main]
  # Also run on main itself. Without this, the suite only ever ran on PR
  # branches — and auto-merged Dependabot commits pushed with GITHUB_TOKEN
  # don't trigger PR workflows on the result, so main was never exercised.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: npx playwright test smoke --project=chromium
