# Nixpacks build config for Dokploy.
#
# Nixpacks 1.41's bundled nixpkgs resolves nodejs_22 to 22.11.0. Vite 8's
# bundler (rolldown) needs Node >=22.12.0 for its native binding, so npm
# silently skips @rolldown/binding-linux-x64-gnu as an incompatible optional
# dependency and `vite build` dies with "Cannot find native binding".
# This pins the setup phase to a nixpkgs-unstable channel revision whose
# nodejs_22 is 22.23.3 (prebuilt in the Nix cache).
#
# TODO: bump to a revision with nodejs_22 >= 22.23.4 (21 Oct 2026 Node.js
# security release) once it reaches a channel:
#   curl -sL https://channels.nixos.org/nixpkgs-unstable/git-revision
# then check pkgs/development/web/nodejs/v22.nix at that revision.
[phases.setup]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "5adc50831c259f87faeb09ddf930d43597197473"
